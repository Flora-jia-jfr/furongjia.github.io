<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta name="author" content="$name">
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$social_image">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$description">
  <meta name="twitter:image" content="$social_image">
  <link rel="icon" href="figures/logo.png" type="image/png">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="index.html">$name</a>
      <nav class="site-nav" aria-label="Main navigation">$navigation</nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" hidden>
        <svg class="theme-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1 9 9 0 1 0 20.9 13.3Z"/></svg>
        <svg class="theme-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <div class="site-layout">
    <aside class="profile" aria-label="Profile and contact">
      <a class="portrait-link" href="index.html" aria-label="$name home">
        <img class="portrait" src="$photo" alt="$name smiling outdoors" width="184" height="184">
      </a>
      <a class="profile-name" href="index.html">$name</a>
      <p class="alias">$alias</p>
      <p class="affiliation">$role<br>$department<br><a href="$institution_url">$institution</a></p>
      <a class="email" href="mailto:$email">$email</a>
      <div class="social-links">$socials</div>
    </aside>
    <div class="reading-column">
      <main id="main">$content</main>
      <footer class="site-footer"><span>$name · $institution</span><a href="mailto:$email">Contact</a></footer>
    </div>
  </div>
</body>
</html>
